[tool.poetry]
name = "poetry-project"
version = "0.1.0"
description = ""
authors = ["MikoDotPol <amikkosh0@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">3.12,<3.13"
requests = "^2.31.0"
matplotlib = "^3.11.2"
pandas = "^3.1.0"

[[tool.poetry.source]]
name = "pypi-mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "pytest (>=9.1.1,<10.0.0)"
]
dev = [
    "ruff (>=0.17.3,<0.18.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]